<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark Manager</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
      form, .search { margin-bottom: 1rem; display: grid; gap: .5rem; max-width: 450px; }
      label { font-weight: 700; display: grid; gap: .25rem; }
      input { padding: .5rem; font-size: 1rem; }
      button { width: fit-content; padding: .45rem .8rem; }
      ul { list-style: none; padding: 0; display: grid; gap: .6rem; }
      li { border: 1px solid #ddd; border-radius: 8px; padding: .7rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
      .meta { display: grid; gap: .2rem; }
      .url { color: #444; font-size: .92rem; }
    </style>
  </head>
  <body>
    <h1>Bookmark Manager</h1>

    <form id="bookmark-form">
      <label for="title">Title
        <input id="title" name="title" required />
      </label>
      <label for="url">URL
        <input id="url" name="url" type="url" required />
      </label>
      <button type="submit">Add Bookmark</button>
    </form>

    <div class="search">
      <label for="search">Search
        <input id="search" name="search" placeholder="Find by title" />
      </label>
    </div>

    <ul id="bookmark-list" aria-label="Bookmark list"></ul>

    <script type="module" src="/main.js"></script>
  </body>
</html>
